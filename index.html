<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Quality</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --ink-2: #55554f; --ink-3: #8a8a83;
    --line: #e6e5e0; --grid: #eeede8;
    --good: #3c9a4f; --moderate: #d9a90b; --usg: #e5782a; --unhealthy: #cf3f3f; --very: #8a3fa6; --hazard: #7a1830;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --ink: #f0efea; --ink-2: #b8b7b0; --ink-3: #85847d;
      --line: #33332f; --grid: #2a2a27;
      --good: #5cbf6e; --moderate: #f0c22e; --usg: #f39350; --unhealthy: #ec6a6a; --very: #b26fcb; --hazard: #c0506b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .muted { color: var(--ink-3); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
  .hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .aqi { font-size: 72px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .aqi-label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .cat { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
  .advice { color: var(--ink-2); margin-top: 4px; max-width: 46ch; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .u { font-size: 13px; color: var(--ink-3); margin-left: 3px; font-weight: 400; }
  .tile .k { font-size: 12px; color: var(--ink-3); }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { fill: var(--ink-3); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg);
         font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-3); font-weight: 500; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { text-align: center; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); }
  .day .d { font-size: 12px; color: var(--ink-3); }
  .day .n { font-size: 20px; font-weight: 600; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .day .bar { height: 4px; border-radius: 2px; margin: 0 10px; }
  .notice { font-size: 13px; color: var(--ink-2); background: var(--grid); border-radius: 8px; padding: 8px 12px; margin-top: 12px; display: none; }
  footer { margin-top: 24px; font-size: 12px; color: var(--ink-3); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name">Air quality</h1>
    <div class="muted" id="updated">Loading…</div>
  </header>
  <div class="notice" id="notice"></div>

  <section class="card hero" aria-live="polite">
    <div>
      <div class="aqi-label">US AQI</div>
      <div class="aqi" id="aqi">–</div>
    </div>
    <div>
      <div class="cat"><span class="dot" id="catdot"></span><span id="cat">–</span></div>
      <div class="advice" id="advice"></div>
      <div class="muted" id="main" style="margin-top:6px"></div>
    </div>
  </section>

  <section class="tiles">
    <div class="tile"><div class="k">PM2.5</div><div class="v" id="pm25">–<span class="u">µg/m³</span></div></div>
    <div class="tile"><div class="k">PM10</div><div class="v" id="pm10">–<span class="u">µg/m³</span></div></div>
    <div class="tile"><div class="k">PM1</div><div class="v" id="pm1">–<span class="u">µg/m³</span></div></div>
    <div class="tile"><div class="k">Temperature</div><div class="v" id="tp">–<span class="u">°C</span></div></div>
    <div class="tile"><div class="k">Humidity</div><div class="v" id="hm">–<span class="u">%</span></div></div>
    <div class="tile"><div class="k">Pressure</div><div class="v" id="pr">–<span class="u">hPa</span></div></div>
  </section>

  <section class="card">
    <h2>US AQI, last 48 hours</h2>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 800 220" role="img" aria-label="Hourly US AQI for the last 48 hours"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <details>
      <summary>Show as table</summary>
      <table id="table"><thead><tr><th>Hour</th><th>US AQI</th><th>PM2.5 µg/m³</th><th>Temp °C</th><th>Humidity %</th></tr></thead><tbody></tbody></table>
    </details>
  </section>

  <section class="card">
    <h2>Daily average US AQI, last 7 days</h2>
    <div class="days" id="days"></div>
  </section>

  <footer>Data from an IQAir AirVisual monitor · refreshes every 5 minutes</footer>
</main>

const fmtHour = ts => new Date(ts).toLocaleTimeString([], { hour: "numeric" });
const setVal = (id, val, digits = 0) => {
  const el = $(id), unit = el.querySelector(".u");
  el.textContent = val == null ? "–" : Number(val).toFixed(digits);
  el.appendChild(unit);
};

async function load() {
  let data, live = true;
  try {
    const r = await fetch(DATA_URL, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    if (!data.current) throw new Error("bad data");
  } catch (e) {
    data = SAMPLE; live = false;
  }
  render(data, live);
}

function render(d, live) {
  const c = d.current;
  $("name").textContent = d.name || "Air quality";
  const ageMin = Math.round((Date.now() - new Date(c.ts)) / 60000);
  $("updated").textContent = "Updated " + fmtTime(c.ts);
  const n = $("notice");
  if (!live) { n.style.display = "block"; n.textContent = "Showing saved sample data — the live feed isn't connected yet."; }
  else if (ageMin > 30) { n.style.display = "block"; n.textContent = `The monitor hasn't reported for ${ageMin} minutes; values may be out of date.`; }
  else n.style.display = "none";

  const k = cat(c.aqius);
  $("aqi").textContent = c.aqius;
  $("catdot").style.background = color(c.aqius);
  $("cat").textContent = k.name;
  $("advice").textContent = k.advice;
  $("main").textContent = "Main pollutant: " + (POLL[c.mainus] || c.mainus);
  setVal("pm25", c.pm25?.conc, 1); setVal("pm10", c.pm10?.conc, 1); setVal("pm1", c.pm1?.conc, 1);
  setVal("tp", c.tp, 1); setVal("hm", c.hm); setVal("pr", c.pr != null ? c.pr / 100 : null);

  drawChart([...d.hourly].reverse());
  drawDays([...d.daily].slice(0, 7).reverse());
}

function drawChart(rows) {
  const svg = $("chart"), W = 800, H = 220, L = 34, R = 8, T = 10, B = 26;
  const vals = rows.map(r => r.pm25.aqius);
  const top = Math.max(50, Math.ceil(Math.max(...vals) / 25) * 25);
  const step = (W - L - R) / rows.length, bw = Math.max(2, step - 2);
  const y = v => T + (H - T - B) * (1 - v / top);
  let s = "";
  for (let g = 0; g <= top; g += top > 100 ? 50 : 25) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="axis" x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  }
  rows.forEach((r, i) => {
    const v = r.pm25.aqius, x = L + i * step + 1, h = Math.max(2, y(0) - y(v));
    s += `<path d="${barPath(x, y(0) - h, bw, h)}" fill="${color(v)}"/>`;
    s += `<rect x="${L + i * step}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`;
    if (new Date(r.ts).getHours() % 6 === 0)
      s += `<text class="axis" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${fmtHour(r.ts)}</text>`;
  });
  svg.innerHTML = s;

  const tip = $("tip"), wrap = svg.parentElement;
  svg.onmousemove = e => {
    const i = e.target.dataset?.i; if (i == null) { tip.style.opacity = 0; return; }
    const r = rows[i];
    tip.innerHTML = `<b>${fmtTime(r.ts)}</b><br>US AQI ${r.pm25.aqius} · ${cat(r.pm25.aqius).name}<br>PM2.5 ${r.pm25.conc} µg/m³ · ${r.tp}°C · ${r.hm}%`;
    const box = wrap.getBoundingClientRect();
    let left = e.clientX - box.left + 12;
    if (left > box.width - 220) left = e.clientX - box.left - 220;
    tip.style.left = left + "px"; tip.style.top = (e.clientY - box.top - 60) + "px"; tip.style.opacity = 1;
  };
  svg.onmouseleave = () => tip.style.opacity = 0;

  const used = [...new Set(vals.map(v => cat(v)))];
  $("legend").innerHTML = used.map(k => `<span><i class="dot" style="background:var(${k.v})"></i>${k.name}</span>`).join("");
  $("table").querySelector("tbody").innerHTML = [...rows].reverse().map(r =>
    `<tr><td>${fmtTime(r.ts)}</td><td>${r.pm25.aqius}</td><td>${r.pm25.conc}</td><td>${r.tp}</td><td>${r.hm}</td></tr>`).join("");
}

// Bar with 4px rounded top corners, square at the baseline.
function barPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function drawDays(days) {
  $("days").innerHTML = days.map(d => {
    const day = new Date(d.ts).toLocaleDateString([], { weekday: "short", timeZone: "UTC" });
    return `<div class="day" title="${cat(d.pm25.aqius).name}"><div class="d">${day}</div><div class="n">${d.pm25.aqius}</div><div class="bar" style="background:${color(d.pm25.aqius)}"></div></div>`;
  }).join("");
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
